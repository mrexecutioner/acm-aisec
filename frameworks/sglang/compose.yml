# SGLang - shipped-as-default compose
services:
  sglang:
    image: lmsysorg/sglang:latest
    container_name: secdefaults-sglang
    ports:
      - "30000:30000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # v2: ungated tiny model (v1 used HF-gated meta-llama/Llama-3.2-1B-Instruct
    # which could not download without a token). Substrate only, not under study.
    command: >
      python3 -m sglang.launch_server
      --model Qwen/Qwen2.5-0.5B-Instruct
      --host 0.0.0.0 --port 30000
    restart: unless-stopped
