# llama.cpp llama-server - shipped-as-default compose.
services:
  llamacpp:
    # v2: the project moved from ghcr.io/ggerganov/llama.cpp (now 404) to ggml-org.
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: secdefaults-llamacpp
    ports:
      - "8080:8080"
    volumes:
      - ${LLAMACPP_MODEL_DIR:-./models}:/models
    # The documented quickstart binds 0.0.0.0 implicitly via the server's defaults.
    command: >
      -m /models/model.gguf --host 0.0.0.0 --port 8080
    restart: unless-stopped
